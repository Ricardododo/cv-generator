<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - CV Generator</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<!-- Estilos personalizados -->
<style>
    body {
        background-color: #f8f9fa;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
    }
    .register-card {
        max-width: 500px;
        width: 100%;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        background-color: #ffffff;
    }
    .register-card h1 {
        font-weight: 600;
        color: #2c3e50;
        margin-bottom: 25px;
        text-align: center;
    }
    .form-floating label {
        color: #6c757d;
    }
    .btn-primary {
        background-color: #0d6efd;
        border: none;
        padding: 12px;
        font-weight: 500;
        border-radius: 8px;
        width: 100%;
    }
    .btn-primary:hover {
        background-color: #0b5ed7;
    }
    .alert {
        border-radius: 8px;
    }
    .login-link {
        text-align: center;
        margin-top: 20px;
    }
</style>
</head>
<body>

<div class="register-card">
    <h1><i class="fas fa-user-plus me-2"></i>Registro</h1>

    <!-- Mostrar mensajes de error (flash) -->
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="fas fa-exclamation-circle me-2"></i><span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Formulario de registro -->
    <form th:action="@{/register}" th:object="${user}" method="post" novalidate>
        <!-- Email -->
        <div class="form-floating mb-3">
            <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="nombre@ejemplo.com" required>
            <label for="email"><i class="fas fa-envelope me-2"></i>Email</label>
            <div class="invalid-feedback" th:errors="*{email}">Email inválido</div>
        </div>

        <!-- Password -->
        <div class="form-floating mb-3">
            <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="Contraseña" required minlength="6">
            <label for="password"><i class="fas fa-lock me-2"></i>Contraseña</label>
            <div class="invalid-feedback" th:errors="*{password}">Mínimo 6 caracteres</div>
        </div>

        <!-- Confirm Password -->
        <div class="form-floating mb-3">
            <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}" placeholder="Confirmar contraseña" required>
            <label for="confirmPassword"><i class="fas fa-check-circle me-2"></i>Confirmar contraseña</label>
            <div class="invalid-feedback" th:errors="*{confirmPassword}">Las contraseñas no coinciden</div>
        </div>

        <button type="submit" class="btn btn-primary">
            <i class="fas fa-user-check me-2"></i>Registrarse
        </button>
    </form>

    <div class="login-link">
        <p>¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión aquí</a></p>
    </div>
</div>

<!-- Bootstrap JS (opcional para alertas) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
