<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis CVs - CV Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .container { max-width: 1200px; margin-top: 30px; }
        .table th { background-color: #0d6efd; color: white; }
        .table td { vertical-align: middle; }
        .btn-group .btn { margin-right: 5px; }
    </style>
</head>
<body>
<div class="container">
    <!-- Mensajes flash -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="fas fa-check-circle me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="fas fa-exclamation-triangle me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1><i class="fas fa-file-alt me-2"></i>Mis CVs</h1>
        <div>
            <a th:href="@{/dashboard}" class="btn btn-outline-primary me-2">
                <i class="fas fa-plus me-1"></i>Nuevo CV
            </a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-danger">
                    <i class="fas fa-sign-out-alt me-1"></i>Cerrar sesión
                </button>
            </form>
        </div>
    </div>

    <!-- Tabla de CVs -->
    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover table-striped">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Nombre del CV</th>
                    <th>Nombre completo</th>
                    <th>Fecha creación</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <!-- Iterar sobre los CVs (usando Thymeleaf) -->
                <tr th:each="cv : ${cvs}">
                    <td th:text="${cv.id}">1</td>
                    <td th:text="${cv.cvName}">CV Principal</td>
                    <td th:text="${cv.fullName}">Juan Pérez</td>
                    <td th:text="${cv.createdAt != null ? #temporals.format(cv.createdAt, 'dd/MM/yyyy HH:mm') : ''}"></td>
                    <td>
                        <div class="btn-group" role="group">
                            <a th:href="@{/edit-cv/{id}(id=${cv.id})}" class="btn btn-sm btn-warning">
                                <i class="fas fa-edit"></i> Editar
                            </a>
                            <a th:href="@{/delete-cv/{id}(id=${cv.id})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar este CV?')">
                                <i class="fas fa-trash"></i> Eliminar
                            </a>
                            <a th:href="@{/preview-cv/{id}(id=${cv.id})}" class="btn btn-sm btn-info" target="_blank">
                                <i class="fas fa-eye"></i> Vista previa
                            </a>
                            <a th:href="@{/download-pdf/{id}(id=${cv.id})}" class="btn btn-sm btn-success">
                                <i class="fas fa-file-pdf"></i> PDF
                            </a>
                        </div>
                    </td>
                </tr>
                <!-- Mensaje si no hay CVs -->
                <tr th:if="${cvs == null or cvs.empty}">
                    <td colspan="5" class="text-center text-muted py-4">
                        <i class="fas fa-inbox fa-2x d-block mb-2"></i>
                        No tienes CVs creados. <a th:href="@{/dashboard}">Crea uno ahora</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
