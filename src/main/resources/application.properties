spring.application.name=cv-generator

#Configuracion de la base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/cv_generator_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=springuser
spring.datasource.password=miclave123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Configuracion de MySQL (para Hibernate)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
#Mostrar SQL en consola
spring.jpa.show-sql=true
#DDL automatico (update crea/actualiza tablas segun las entidades)
spring.jpa.hibernate.ddl-auto=update
#Formatear SQL para mejor lectura
spring.jpa.properties.hibernate.format_sql=true

#Mostrar parametros de las consultas SQL (nivel DEBUG para Hibernate)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Cambiar puerto de la aplicacion (por defecto 8080)
server.port=8090

# Configuracion de subida de archivos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
upload.dir=uploads/
